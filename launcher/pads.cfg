<?xml version="1.0"?>
<!-- Coinless's controls, passed to every game with -ctrlr (Library.arguments). MAME treats them as
     its defaults; changes made in MAME's menu are saved to cfg/ and win over them.
     "default": buttons 1-6 are A S D F G H and □ ✕ ○ △ L1 R1 on the PS4 pad (attack □, jump ✕,
     as on PlayStation releases of these games). Options is Start and Share is Coin (MAME's own
     defaults). Player 2 is the second pad, or Q W E R T Y with I J K L to move, so the two
     players' keys never overlap.
     A game gets its own section only when its buttons sit better elsewhere on the pad; a tagged
     port must match the game's tag, mask and defvalue exactly (dump them with a Lua script).
     Super Nintendo: by position, ✕ B, ○ A, □ Y, △ X, L1 L, R1 R, Options Start, Share Select. -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON1">
                <newseq type="standard">KEYCODE_A OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port type="P1_BUTTON2">
                <newseq type="standard">KEYCODE_S OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port type="P1_BUTTON3">
                <newseq type="standard">KEYCODE_D OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port type="P1_BUTTON4">
                <newseq type="standard">KEYCODE_F OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port type="P1_BUTTON5">
                <newseq type="standard">KEYCODE_G OR JOYCODE_1_BUTTON5</newseq>
            </port>
            <port type="P1_BUTTON6">
                <newseq type="standard">KEYCODE_H OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <port type="P2_BUTTON1">
                <newseq type="standard">KEYCODE_Q OR JOYCODE_2_BUTTON3</newseq>
            </port>
            <port type="P2_BUTTON2">
                <newseq type="standard">KEYCODE_W OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port type="P2_BUTTON3">
                <newseq type="standard">KEYCODE_E OR JOYCODE_2_BUTTON2</newseq>
            </port>
            <port type="P2_BUTTON4">
                <newseq type="standard">KEYCODE_R OR JOYCODE_2_BUTTON4</newseq>
            </port>
            <port type="P2_BUTTON5">
                <newseq type="standard">KEYCODE_T OR JOYCODE_2_BUTTON5</newseq>
            </port>
            <port type="P2_BUTTON6">
                <newseq type="standard">KEYCODE_Y OR JOYCODE_2_BUTTON6</newseq>
            </port>
            <port type="P2_JOYSTICK_UP">
                <newseq type="standard">KEYCODE_I OR JOYCODE_2_YAXIS_UP_SWITCH OR JOYCODE_2_HAT1UP</newseq>
            </port>
            <port type="P2_JOYSTICK_DOWN">
                <newseq type="standard">KEYCODE_K OR JOYCODE_2_YAXIS_DOWN_SWITCH OR JOYCODE_2_HAT1DOWN</newseq>
            </port>
            <port type="P2_JOYSTICK_LEFT">
                <newseq type="standard">KEYCODE_J OR JOYCODE_2_XAXIS_LEFT_SWITCH OR JOYCODE_2_HAT1LEFT</newseq>
            </port>
            <port type="P2_JOYSTICK_RIGHT">
                <newseq type="standard">KEYCODE_L OR JOYCODE_2_XAXIS_RIGHT_SWITCH OR JOYCODE_2_HAT1RIGHT</newseq>
            </port>
        </input>
    </system>
    <system name="sf2ce">
        <input>
            <port tag=":IN1" type="P1_BUTTON1" mask="16" defvalue="16">  <!-- jab □ -->
                <newseq type="standard">KEYCODE_A OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON2" mask="32" defvalue="32">  <!-- strong △ -->
                <newseq type="standard">KEYCODE_S OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON3" mask="64" defvalue="64">  <!-- fierce R1 -->
                <newseq type="standard">KEYCODE_D OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <port tag=":IN2" type="P1_BUTTON4" mask="1" defvalue="1">  <!-- short ✕ -->
                <newseq type="standard">KEYCODE_Z OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":IN2" type="P1_BUTTON5" mask="2" defvalue="2">  <!-- forward ○ -->
                <newseq type="standard">KEYCODE_X OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port tag=":IN2" type="P1_BUTTON6" mask="4" defvalue="4">  <!-- roundhouse L1 -->
                <newseq type="standard">KEYCODE_C OR JOYCODE_1_BUTTON5</newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON1" mask="4096" defvalue="4096">
                <newseq type="standard">KEYCODE_Q OR JOYCODE_2_BUTTON3</newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON2" mask="8192" defvalue="8192">
                <newseq type="standard">KEYCODE_W OR JOYCODE_2_BUTTON4</newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON3" mask="16384" defvalue="16384">
                <newseq type="standard">KEYCODE_E OR JOYCODE_2_BUTTON6</newseq>
            </port>
            <port tag=":IN2" type="P2_BUTTON4" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_R OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port tag=":IN2" type="P2_BUTTON5" mask="32" defvalue="32">
                <newseq type="standard">KEYCODE_T OR JOYCODE_2_BUTTON2</newseq>
            </port>
            <port tag=":IN2" type="P2_BUTTON6" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_Y OR JOYCODE_2_BUTTON5</newseq>
            </port>
        </input>
    </system>
    <system name="tekken3">
        <input>
            <port tag=":JVS_PLAYER1" type="P1_BUTTON1" mask="2" defvalue="0">  <!-- left punch □ -->
                <newseq type="standard">KEYCODE_A OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port tag=":JVS_PLAYER1" type="P1_BUTTON2" mask="1" defvalue="0">  <!-- right punch △ -->
                <newseq type="standard">KEYCODE_S OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port tag=":JVS_PLAYER1" type="P1_BUTTON3" mask="16384" defvalue="0">  <!-- left kick ✕ -->
                <newseq type="standard">KEYCODE_Z OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":JVS_PLAYER1" type="P1_BUTTON4" mask="8192" defvalue="0">  <!-- right kick ○ -->
                <newseq type="standard">KEYCODE_X OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port tag=":JVS_PLAYER2" type="P2_BUTTON1" mask="2" defvalue="0">
                <newseq type="standard">KEYCODE_Q OR JOYCODE_2_BUTTON3</newseq>
            </port>
            <port tag=":JVS_PLAYER2" type="P2_BUTTON2" mask="1" defvalue="0">
                <newseq type="standard">KEYCODE_W OR JOYCODE_2_BUTTON4</newseq>
            </port>
            <port tag=":JVS_PLAYER2" type="P2_BUTTON3" mask="16384" defvalue="0">
                <newseq type="standard">KEYCODE_E OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port tag=":JVS_PLAYER2" type="P2_BUTTON4" mask="8192" defvalue="0">
                <newseq type="standard">KEYCODE_R OR JOYCODE_2_BUTTON2</newseq>
            </port>
        </input>
    </system>
    <system name="snes">
        <input>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON1" mask="2" defvalue="0">  <!-- Y □ -->
                <newseq type="standard">KEYCODE_A OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON2" mask="1" defvalue="0">  <!-- B ✕ -->
                <newseq type="standard">KEYCODE_S OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON3" mask="256" defvalue="0">  <!-- A ○ -->
                <newseq type="standard">KEYCODE_D OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON4" mask="512" defvalue="0">  <!-- X △ -->
                <newseq type="standard">KEYCODE_F OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON5" mask="1024" defvalue="0">  <!-- L L1 -->
                <newseq type="standard">KEYCODE_G OR JOYCODE_1_BUTTON5</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON6" mask="2048" defvalue="0">  <!-- R R1 -->
                <newseq type="standard">KEYCODE_H OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_SELECT" mask="4" defvalue="0">  <!-- Select Share -->
                <newseq type="standard">KEYCODE_5 OR JOYCODE_1_SELECT</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_START" mask="8" defvalue="0">  <!-- Start Options -->
                <newseq type="standard">KEYCODE_1 OR JOYCODE_1_START</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON1" mask="2" defvalue="0">
                <newseq type="standard">KEYCODE_Q OR JOYCODE_2_BUTTON3</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON2" mask="1" defvalue="0">
                <newseq type="standard">KEYCODE_W OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON3" mask="256" defvalue="0">
                <newseq type="standard">KEYCODE_E OR JOYCODE_2_BUTTON2</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON4" mask="512" defvalue="0">
                <newseq type="standard">KEYCODE_R OR JOYCODE_2_BUTTON4</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON5" mask="1024" defvalue="0">
                <newseq type="standard">KEYCODE_T OR JOYCODE_2_BUTTON5</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON6" mask="2048" defvalue="0">
                <newseq type="standard">KEYCODE_Y OR JOYCODE_2_BUTTON6</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_SELECT" mask="4" defvalue="0">
                <newseq type="standard">KEYCODE_6 OR JOYCODE_2_SELECT</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_START" mask="8" defvalue="0">
                <newseq type="standard">KEYCODE_2 OR JOYCODE_2_START</newseq>
            </port>
        </input>
    </system>
</mameconfig>

<?xml version="1.0"?>
<!-- Coinless's pad layouts for consoles, passed with -ctrlr (Library.arguments). PS4 face buttons
     match the SNES pad by position: ✕ B, ○ A, □ Y, △ X, L1 L, R1 R, Options Start, Share Select.
     Keys follow cfg/default.cfg for player 1 (A S D F G H) and MAME's defaults for player 2.
     Changes made in MAME's menu are saved to cfg/snes.cfg and win over these. -->
<mameconfig version="10">
    <system name="snes">
        <input>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON1" mask="2" defvalue="0">
                <newseq type="standard">KEYCODE_A OR JOYCODE_1_BUTTON3</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON2" mask="1" defvalue="0">
                <newseq type="standard">KEYCODE_S OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON3" mask="256" defvalue="0">
                <newseq type="standard">KEYCODE_D OR JOYCODE_1_BUTTON2</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON4" mask="512" defvalue="0">
                <newseq type="standard">KEYCODE_F OR JOYCODE_1_BUTTON4</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON5" mask="1024" defvalue="0">
                <newseq type="standard">KEYCODE_G OR JOYCODE_1_BUTTON5</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON6" mask="2048" defvalue="0">
                <newseq type="standard">KEYCODE_H OR JOYCODE_1_BUTTON6</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_SELECT" mask="4" defvalue="0">
                <newseq type="standard">KEYCODE_5 OR JOYCODE_1_SELECT</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_START" mask="8" defvalue="0">
                <newseq type="standard">KEYCODE_1 OR JOYCODE_1_START</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON1" mask="2" defvalue="0">
                <newseq type="standard">KEYCODE_A OR JOYCODE_2_BUTTON3</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON2" mask="1" defvalue="0">
                <newseq type="standard">KEYCODE_S OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON3" mask="256" defvalue="0">
                <newseq type="standard">KEYCODE_Q OR JOYCODE_2_BUTTON2</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON4" mask="512" defvalue="0">
                <newseq type="standard">KEYCODE_W OR JOYCODE_2_BUTTON4</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON5" mask="1024" defvalue="0">
                <newseq type="standard">KEYCODE_E OR JOYCODE_2_BUTTON5</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_BUTTON6" mask="2048" defvalue="0">
                <newseq type="standard">KEYCODE_T OR JOYCODE_2_BUTTON6</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_SELECT" mask="4" defvalue="0">
                <newseq type="standard">KEYCODE_6 OR JOYCODE_2_SELECT</newseq>
            </port>
            <port tag=":ctrl2:joypad:JOYPAD" type="P2_START" mask="8" defvalue="0">
                <newseq type="standard">KEYCODE_2 OR JOYCODE_2_START</newseq>
            </port>
        </input>
    </system>
</mameconfig>
